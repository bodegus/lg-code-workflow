full_name = "bodegus/openclaw2-deploy"
default_branch = "main"
allowed_authors = ["bodegus"]
# Each gate command provisions its own pinned tooling through uv; no project setup.
setup = []
gate = [
  "uv run --no-project --python 3.12 --with-requirements images/ops/requirements.txt --with pytest --with pytest-xdist python -m pytest -q -p no:cacheprovider -n 4 tests/unit/test_github_issue_write.py tests/unit/test_task_mcp.py",
  "uvx ruff@0.16.8 check ops tests",
]
# Native acceptance scope=all is an additional reviewer-owned merge gate.
required_checks = [
  { workflow = "CI", job = "lint" },
  { workflow = "CI", job = "validate" },
  { workflow = "CI", job = "unit" },
]
protected_globs = [
  ".github/**", "AGENTS.md", "CLAUDE.md", "PLAN.md", "versions.lock.json", "agents/**",
  ".agents/**", ".claude/**", ".codex/**", ".env*",
]
excluded_globs = []
source_globs = ["ops/**"]
tests_globs = ["tests/**"]
docs_globs = ["**/*.md"]
known_flaky = []
pre_existing_policy = "note"

[[risk_classes]]
name = "ci_supply_chain"
globs = [".github/**", "images/**", "versions.lock.json", "compose*.yaml"]

[[risk_classes]]
name = "agent_instructions"
globs = ["AGENTS.md", "CLAUDE.md", "agents/**", ".agents/**"]

[[risk_classes]]
name = "secrets_auth"
globs = ["ops/github_app*.py", "ops/credentials*.py", "env/**"]
