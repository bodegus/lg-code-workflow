[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lgcw"
version = "0.1.0"
description = "A deterministic LangGraph workflow from GitHub issue to merge-ready PR"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langgraph>=1.2.15,<1.3",
    "openai-codex==0.162.1",
    "openai-codex-cli-bin==0.162.1",
    "githubkit==0.16.1",
    "pydantic>=2.12",
]

[project.scripts]
lgcw = "lgcw.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.4",
    "pytest-cov>=5",
    "ruff",
    "mypy",
    "pre-commit",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lgcw"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "typings"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers --strict-config --import-mode=importlib"
markers = [
    "unit: isolated tests without network, LLM calls, or real tokens",
    "live: real GitHub or Codex calls, enabled only with LGCW_LIVE=1",
]

[tool.coverage.run]
source = ["lgcw"]
omit = ["src/lgcw/harness/codex.py", "src/lgcw/github/client.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
